# Five required checks (typecheck/lint/unit-tests/build/integration-tests),
# run on every PR into main (and again on push to main as a post-merge
# safety net). `e2e-tests` (Playwright) runs alongside them but is
# deliberately not one of the required five — see its own comment below
# for why, and CONTRIBUTING.md for the required-check list itself.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run vercel-build

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: house_maintenance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # A throwaway container DB for this job only — not real secrets, so
      # hardcoding values here (rather than GitHub Secrets) is fine.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/house_maintenance_test
      JWT_SECRET: ci-integration-test-secret
      CRON_SECRET: ci-integration-test-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:internal-packages
      - run: node db/migrate.mjs
      - run: npm run test:integration --workspace=api

  # Not one of the five required checks: it's new (2026-08-11) and hasn't
  # proven itself as non-flaky in CI yet the way the other five have.
  # Promote it to required once it's had a run of clean history — see
  # CONTRIBUTING.md. Uses the mock-API harness described in
  # apps/web/playwright.config.ts (page.route interception, not a real
  # Postgres/Blob/VAPID-backed deployment), which is what makes this
  # cheap enough to run in CI at all.
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:internal-packages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
