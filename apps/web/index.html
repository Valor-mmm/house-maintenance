<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1b16" />
    <title>House Maintenance</title>
    <!--
      Applies a saved manual theme choice before any CSS renders, so there's
      no flash of the wrong theme while React boots. Key/values must match
      src/theme.ts's THEME_STORAGE_KEY exactly — this script can't import
      that module, it has to run standalone before the bundle loads.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("house-maintenance:theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
